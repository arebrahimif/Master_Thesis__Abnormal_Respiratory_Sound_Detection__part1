[tool.poetry]
name = "master thesis"
version = "0.1.0"
description = "Master's Thesis, Pattern Classification in lung sound to detect wheezes and crackles then diagnoses possible illness."
authors = ["Armin <ar.ebrahimif@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pandas = "^2.3.3"
numpy = "^2.3.5"
librosa = "^0.11.0"
scikit-learn = "^1.7.2"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"
jupyterlab = "^4.5.0"
notebook = "^7.5.0"
torchaudio = {version = "2.10.0", source = "pytorch-cu130"}
squarify = "^0.4.4"
tqdm = "^4.67.1"
soundfile = "^0.13.1"
pathlib = "^1.0.1"
torchcodec = "^0.9.1"
ffmpeg = "^1.4"
nnaudio = "^0.3.4"
nlpaug = "^1.1.11"
torch = {version = "2.10.0", source = "pytorch-cu130"}
torchvision = {version = "0.25.0", source = "pytorch-cu130"}
pytorch-wavelets = "^1.3.0"
pywavelets = "^1.9.0"
opencv-python = "^4.13.0.92"
speechbrain = "^1.0.3"
torchlibrosa = "^0.1.0"
pytorch-utils = "^0.5.5"
imblearn = "^0.0"
wandb = "^0.25.1"
av = "^17.0.0"
h5py = "^3.16.0"
transformers = "^5.5.0"
pytorch-lightning = "^2.6.1"
attrs = "^26.1.0"


[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
